name: Publish a changed version to PyPI

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and create the tag/release; false runs the preflight only"
        type: boolean
        default: false

concurrency:
  group: publish-tlaw-to-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Detect the release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine the release candidate and publish decision
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'false' }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path


          def project_version(text: str) -> str:
              project = tomllib.loads(text).get("project")
              if not isinstance(project, dict):
                  raise SystemExit("pyproject.toml has no [project] table")

              name = project.get("name")
              version = project.get("version")
              if name != "tlaw":
                  raise SystemExit(f"expected project name 'tlaw', found {name!r}")
              if not isinstance(version, str) or not version:
                  raise SystemExit("[project].version must be a non-empty string")
              return version


          current = project_version(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          event = os.environ["EVENT_NAME"]

          if event == "workflow_dispatch":
              # A manual dispatch names the current pyproject version as the
              # candidate. It is publishable only when the dispatcher asked
              # for publication; the default is a no-upload preflight.
              previous = None
              changed = True
              publish = (
                  os.environ.get("DISPATCH_PUBLISH", "").strip().lower() == "true"
              )
              decision = (
                  "manual dispatch: verify the current version"
                  + (" and publish" if publish else " without publishing")
              )
          else:
              # A push to main releases only when the pyproject version
              # changed in that push. This stays the ordinary release signal.
              before = os.environ["BEFORE"]
              if before == "0" * 40:
                  previous = None
              else:
                  result = subprocess.run(
                      ["git", "show", f"{before}:pyproject.toml"],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode != 0:
                      raise SystemExit(
                          "could not read pyproject.toml from the commit before "
                          "this push; refusing to guess whether this is a release"
                      )
                  previous = project_version(result.stdout)
              changed = previous != current
              publish = True
              decision = (
                  "release required"
                  if changed
                  else "version unchanged; nothing to publish"
              )

          old = previous if previous is not None else "(no previous version)"
          print(f"tlaw version: {old} -> {current}")
          print(decision)

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as output:
              print(f"changed={'true' if changed else 'false'}", file=output)
              print(f"version={current}", file=output)
              print(f"publish={'true' if publish else 'false'}", file=output)

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as summary:
              print("## PyPI release decision", file=summary)
              print(file=summary)
              print(f"`tlaw` version: `{old}` -> `{current}`", file=summary)
              print(file=summary)
              print(decision, file=summary)
          PY

  build:
    name: Verify and build ${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify the committed lockfile
        run: uv lock --check

      - name: Install the committed dependencies
        run: uv sync --locked

      - name: Verify the changelog format
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = "<!-- towncrier release notes start -->"
          if changelog.count(marker) != 1:
              raise SystemExit(
                  "CHANGELOG.md must contain exactly one Towncrier marker"
              )
          PY

      - name: Verify the release changelog was prepared
        # A no-upload preflight may run before the version is chosen, so it
        # checks the changelog format above but not release-only preparation.
        if: needs.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path


          pending = sorted(
              path
              for path in Path("changes").iterdir()
              if path.name != "README.md"
          )
          if pending:
              names = "\n".join(f"- {path}" for path in pending)
              raise SystemExit(
                  "release fragments have not been compiled:\n"
                  f"{names}\n"
                  "run `uv run towncrier build --yes --version "
                  f"{os.environ['RELEASE_VERSION']}` and commit the result"
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = re.escape(os.environ["RELEASE_VERSION"])
          heading = re.compile(
              rf"^## {version} — \d{{4}}-\d{{2}}-\d{{2}}$",
              re.MULTILINE,
          )
          if len(heading.findall(changelog)) != 1:
              raise SystemExit(
                  "CHANGELOG.md must contain exactly one dated heading for "
                  f"version {os.environ['RELEASE_VERSION']}"
              )
          PY

      - name: Run the complete repository gate
        # Publishing must not race past a failure in the separate CI workflow.
        run: ./scripts/gate

      - name: Build the source and wheel distributions
        run: uv build --clear

      - name: Exercise the exact wheel that will be published
        run: uv run python scripts/check_installed.py --wheel dist/*.whl

      - name: Validate the distributions without uploading
        run: uv publish --dry-run dist/*

      - name: Save the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tlaw-${{ needs.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs:
      - version
      - build
    if: needs.version.outputs.changed == 'true' && needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/tlaw/${{ needs.version.outputs.version }}/
    permissions:
      # id-token: PyPI trusted publishing and PEP 740 provenance attestations.
      # contents: the annotated tag and GitHub Release created after the upload.
      id-token: write
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tlaw-${{ needs.version.outputs.version }}
          path: dist/

      - name: Check whether the version is already published
        id: published
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if curl --fail --silent --show-error \
              "https://pypi.org/pypi/tlaw/${VERSION}/json" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=PyPI::tlaw ${VERSION} is already on PyPI; skipping the upload."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with trusted publishing and provenance
        # The action uploads only on a real run and skips files that already
        # exist. When id-token: write is present it also generates and uploads
        # PEP 740 provenance attestations for exactly the files it uploads.
        if: steps.published.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true

      - name: Tag the release and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          python3 - "$VERSION" release-notes.md <<'PY'
          import re
          import sys
          from pathlib import Path


          version = sys.argv[1]
          output = Path(sys.argv[2])
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## {re.escape(version)} — .*?$(?P<body>.*?)(?=^## |\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if match is None:
              raise SystemExit(
                  f"CHANGELOG.md has no section for version {version}"
              )
          body = match.group("body").strip()
          if not body:
              raise SystemExit(
                  f"CHANGELOG.md section for version {version} is empty"
              )
          output.write_text(f"# tlaw {version}\n\n{body}\n", encoding="utf-8")
          PY

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            echo "::notice title=GitHub Release::Updated existing release ${tag}."
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "tlaw ${VERSION}" \
              --notes-file release-notes.md
            echo "::notice title=GitHub Release::Created release ${tag}."
          fi
