[project]
name = "tlaw"
description = "Write and enforce executable behavioral laws for Python code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
version = "0.0.9"
requires-python = ">=3.12"
authors = [{ name = "Teïlo Millet", email = "i@teilomillet.com" }]
keywords = [
    "property-based-testing",
    "hypothesis",
    "mutation-testing",
    "specification",
    "laws",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "hypothesis>=6.160.0",
    "pytest>=9.1.1",
]

[project.urls]
Repository = "https://github.com/teilomillet/tlaw"
Documentation = "https://github.com/teilomillet/tlaw/tree/main/docs"

[project.scripts]
tlaw = "tlaw.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "crosshair-tool>=0.0.110",
    "numpy>=2.5.1",
    "ruff>=0.15.22",
    "towncrier>=25.8.0",
]

[tool.towncrier]
package = "tlaw"
package_dir = "."
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} — {project_date}"
issue_format = "[#{issue}](https://github.com/teilomillet/tlaw/issues/{issue})"
underlines = ["", "", ""]
wrap = true
ignore = []

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "limitations"
name = "Known limitations"
showcontent = true
